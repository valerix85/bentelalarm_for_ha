name: Claude with Custom App

# Runs Claude Code when "@claude" is written in an issue/PR comment,
# in a review or in the title/body of a new issue.
# Setup: https://github.com/anthropics/claude-code-action/blob/main/docs/setup.md
# Required secrets: APP_ID, APP_PRIVATE_KEY, ANTHROPIC_API_KEY
# (API key from https://console.anthropic.com, with available credit)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude-response:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read # to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Generate a token from the custom GitHub App
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Run Claude with the App token (comments/commits made as the App)
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          # Sonnet: cheaper, and does not need the 1M-token context
          # (which low-tier API keys may not have access to)
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
