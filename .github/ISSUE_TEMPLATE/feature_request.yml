name: Feature request
description: Suggest something the integration could do
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: Describe the feature and how you would use it in Home Assistant.
    validations:
      required: true
  - type: input
    id: panel
    attributes:
      label: Panel model and firmware
      placeholder: Absoluta 16, 3.60.37
